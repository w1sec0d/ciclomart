name: Mirror backend to legacy repo

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/mirror-backend.yml'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure git-subtree is available
        run: |
          if ! git subtree 2>&1 | grep -q "usage: git subtree"; then
            curl -fsSL https://raw.githubusercontent.com/git/git/master/contrib/subtree/git-subtree.sh \
              -o "$RUNNER_TEMP/git-subtree"
            chmod +x "$RUNNER_TEMP/git-subtree"
            echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          fi

      - name: Push backend subtree to legacy repository
        env:
          LEGACY_BACKEND_TOKEN: ${{ secrets.LEGACY_BACKEND_TOKEN }}
          LEGACY_BACKEND_REPO_URL: ${{ vars.LEGACY_BACKEND_REPO_URL }}
        run: |
          if [ -z "$LEGACY_BACKEND_REPO_URL" ]; then
            echo "::error::Set the LEGACY_BACKEND_REPO_URL repository variable"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix=backend -b backend-mirror
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$LEGACY_BACKEND_TOKEN" | base64 -w0)"
          git -c http.extraheader="$AUTH_HEADER" push --force "$LEGACY_BACKEND_REPO_URL" backend-mirror:main
